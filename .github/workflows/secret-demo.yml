name: Secret Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Démonstration des secrets et variables
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
          APP_ENV: ${{ vars.APP_ENV }}
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Erreur : DEMO_TOKEN est vide !"
            exit 1
          fi
          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Tentative d'affichage du secret : $DEMO_TOKEN"
          echo "Environnement de l'application : $APP_ENV"
