name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer pytest
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion au registre GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer le nom d'image et la version
        id: prep
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_BASE="ghcr.io/${OWNER}/tasks-api"
          echo "image=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Métadonnées Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.prep.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Connexion au registre GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déployer et tester sur staging (test de fumée)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${OWNER}/tasks-api:sha-${SHORT_SHA}"
          docker pull "$IMAGE"
          docker run -d -p 8000:8000 --name api-staging "$IMAGE"
          echo "Attente du démarrage de l'API sur staging..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Smoke test réussi sur staging !"
              exit 0
            fi
            sleep 2
          done
          echo "Échec du smoke test sur staging"
          exit 1

  deploy-production:
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connexion au registre GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Déployer et tester sur production (test de fumée)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${OWNER}/tasks-api:${VERSION}"
          docker pull "$IMAGE"
          docker run -d -p 8000:8000 --name api-production "$IMAGE"
          echo "Attente du démarrage de l'API sur production..."
          for i in {1..10}; do
            if curl -f http://localhost:8000/health && curl -f http://localhost:8000/version; then
              echo "Smoke test réussi sur production !"
              exit 0
            fi
            sleep 2
          done
          echo "Échec du smoke test sur production"
          exit 1
